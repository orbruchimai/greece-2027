<link rel="stylesheet" href="main.css">
<style>
html, body { margin: 0; background: #f4efec; }
/* The kit stylesheet pins #root to a fixed viewport scroller for the app shell;
   as a standalone page the document must grow with its content. */
html, body, #root { position: static !important; height: auto !important; overflow: visible !important; overflow-x: clip !important; overscroll-behavior: auto !important; }
body { padding: 0 0 32px; }
@media (min-width: 760px) { body { padding-top: 32px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Standalone host shim: the kit expects a small host API for routing and
   device-local state. Routes stay in memory; local state persists in localStorage. */
window.fileHost = Object.freeze({
  initialRoute: '/',
  route: function () {},
  asset: function (v) { return v; },
  request: function (method, params) {
    try {
      if (method === 'local.read') {
        var v = localStorage.getItem('greece2027.' + params.key);
        return Promise.resolve(v == null ? { status: 'saved' } : { status: 'saved', value: v });
      }
      if (method === 'local.write') {
        localStorage.setItem('greece2027.' + params.key, params.value);
        return Promise.resolve({ status: 'saved' });
      }
    } catch (e) {
      return Promise.resolve({ status: 'unavailable' });
    }
    return Promise.resolve({ status: 'unavailable' });
  }
});
</script>
<script src="main.js" crossorigin="anonymous"></script>
</body>
